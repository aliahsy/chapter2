<!DOCTYPE html>
<html>
<head>
    <title>Lab Exercise 2.1 HTML Part B</title>
</head>
<body>
    <h1>LAB EXERCISE 2.1 HTML PART B</h1>
    <form action="#" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password"><br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label><br>
    <input type="radio" id="other" name="gender" value="Other">
    <label for="other">Other</label><br><br>

    <label for="age">Age:</label>
    <select id="age" name="age">
        <option value="">Select Age</option>
        <option value="18-20">18-20</option>
        <option value="21-25">21-25</option>
        <option value="26+">26+</option>
</select><br><br>
    <label for="interests">Interests:</label><br>
    <textarea id="interests" name="interests" rows="4" cols="40"></textarea><br><br>

    <label>Subscribe to Newsletter:</label>
    <input type="checkbox" id="yes" name="subscribe" value="Yes">
    <label for="yes">Yes</label>
    <input type="checkbox" id="no" name="subscribe" value="No">
    <label for="no">No</label>
    <input type="checkbox" id="not_interested" name="subscribe" value="Not Interested">
    <label for="not_interested">Not Interested</label><br><br>
    <input type="submit" value="Submit">
    </form>
</body>
</html>
